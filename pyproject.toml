[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "critic-divergence-tester"
version = "0.1.0"
description = "Local-first, model-neutral argument and document review workbench"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = []

[tool.setuptools]
py-modules = [
  "argument_adjudication",
  "argument_app",
  "argument_baseline",
  "argument_citations",
  "argument_contracts",
  "argument_gate",
  "argument_gate_b",
  "argument_ir",
  "argument_lens_view",
  "argument_lineage",
  "argument_perspective",
  "argument_resolution",
  "argument_review",
  "argument_revision",
  "argument_sessions",
  "argument_triage",
  "argument_ui",
  "argument_versioning",
  "argument_workbench",
  "critic_execution",
  "critic_runner",
  "critic_scoring",
  "critic_workflow",
  "document_review_ingest",
  "document_review_model",
  "document_review_studio",
  "document_review_ui",
  "document_review_ui_shell",
]

[tool.setuptools.data-files]
"." = ["build-verifier.md", "citation-auditor.md", "critic-contrastivist.md", "critic-engineering.md", "critic-individualist.md", "critic-natural-science.md", "critic-social-science.md", "diff-reviewer.md", "divergence-test.md"]
"ir" = ["ir/social-science-checks.json"]
"schemas" = ["schemas/revision-workflow.schema.json"]

[project.scripts]
critic-divergence-tester = "critic_runner:main"

[project.optional-dependencies]
# Kept optional so the existing Markdown/TXT workflow remains zero-install.
# The adapters report their state through `critic_runner.py doctor`.
pdf = [
  "pypdf>=5.0,<7.0",
  "pymupdf>=1.24,<2.0",
]
ocr = [
  "pytesseract>=0.3.10,<0.4",
  "pillow>=10.0,<13.0",
]
all = [
  "pypdf>=5.0,<7.0",
  "pymupdf>=1.24,<2.0",
  "pytesseract>=0.3.10,<0.4",
  "pillow>=10.0,<13.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
