[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "critic-divergence-tester"
version = "0.2.4"
description = "Local-first, model-neutral argument and document review workbench"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = []

[tool.setuptools]
packages = ["cli", "contracts", "document_review_stores", "studio_web"]
py-modules = [
  "project_lifecycle",
  "document_review_word",
  "document_review_pdf_render",
  "studio_ui_state",
  "studio_launcher",
  "studio_selftest",
  "studio_startup",
  "document_text_encoding",
  "document_review_office_formats",
  "document_review_text_formats",
  "document_review_legacy",
  "academic_review",
  "argument_adjudication",
  "argument_app",
  "argument_baseline",
  "argument_citations",
  "argument_contracts",
  "argument_gate",
  "argument_gate_b",
  "argument_gate_common",
  "argument_ir",
  "argument_lens_view",
  "argument_lineage",
  "argument_perspective",
  "argument_resolution",
  "argument_review",
  "argument_revision",
  "argument_sessions",
  "argument_triage",
  "argument_ui",
  "argument_versioning",
  "argument_workbench",
  "critic_execution",
  "critic_runner",
  "critic_scoring",
  "critic_workflow",
  "document_review_ingest",
  "document_review_components",
  "document_review_model",
  "document_review_quality",
  "document_review_adversarial",
  "document_review_studio",
  "document_review_ui",
  "document_review_ui_shell",
  "project_lock",
  "review_profiles",
  "unified_app",
]

[tool.setuptools.package-data]
studio_web = ["*.html", "*.css", "*.js", "*.json"]

[tool.setuptools.data-files]
"." = ["build-verifier.md", "citation-auditor.md", "critic-contrastivist.md", "critic-engineering.md", "critic-individualist.md", "critic-natural-science.md", "critic-social-science.md", "diff-reviewer.md", "divergence-test.md"]
"ir" = ["ir/social-science-checks.json"]
"schemas" = ["schemas/revision-workflow.schema.json"]

[project.scripts]
critic-divergence-tester = "critic_runner:main"
document-review-studio = "studio_launcher:main"

[project.optional-dependencies]
# Kept optional so the existing Markdown/TXT workflow remains zero-install.
# The adapters report their state through `critic_runner.py doctor`.
pdf = [
  "pypdf>=5.0,<7.0",
  "pypdfium2>=5.13,<6.0",
]
ocr = [
  "pypdf>=5.0,<7.0",
  "pypdfium2>=5.13,<6.0",
]
all = [
  "pypdf>=5.0,<7.0",
  "pypdfium2>=5.13,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
