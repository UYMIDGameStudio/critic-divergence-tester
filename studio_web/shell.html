<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>文書與論證審查工作台 · Experimental Preview</title>
    <style>
      __STYLES__
    </style>
  </head>
  <body>
    <a class="skip-link" id="skip-to-content" href="#app">跳至工作區</a>
    <main>
      <header class="studio-header">
        <div class="studio-identity">
          <svg class="studio-mark" aria-hidden="true" viewBox="0 0 40 48" fill="none"><path d="M10 5H4v38h6M30 5h6v38h-6M14 15h12M14 23h12M14 31h7" stroke="currentColor" stroke-width="2"/><path d="m21 36 3 3 8-9" stroke="var(--annotation)" stroke-width="2"/></svg>
          <div><div class="brand"><span id="studio-motto">文稿 · 證據 · 修訂</span><span class="preview-badge" id="studio-preview">experimental preview</span></div><h1 id="studio-title">文書與論證審查工作台</h1></div>
        </div>
        <div class="header-controls">
          <label for="ui-language" class="language-label">語言 / Language</label><select id="ui-language" aria-label="Interface language"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select>
          <div id="session-actions"></div>
        </div>
        <p class="muted" id="studio-description">匯入並確認內容，完成審查後逐項批准修改。原始檔案完整保留在本機。</p>
      </header>
      <div
        id="operation-status"
        class="operation-status hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div id="app" tabindex="-1"></div>
    </main>
    <script>
      __SCRIPTS__;
    </script>
  </body>
</html>
