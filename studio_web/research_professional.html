<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-research-text="Argument Workbench">Argument Workbench</title>
<style>__STYLES__</style>
</head>
<body>
<header class="top"><div class="topline"><div><div class="brand" data-research-text="Argument Workbench">Argument Workbench</div><div id="projectTitle"></div></div><div class="version"><select id="research-language" aria-label="介面語言"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><button class="history-button" id="historyButton" data-research-text="Argument History">Argument History</button><label for="version" data-research-text="稿件版本">稿件版本</label><select id="version"></select></div></div><div class="metrics" id="metrics"></div></header>
<main class="workspace"><section class="pane"><div class="pane-head"><h2 data-research-text="Manuscript · 原文">Manuscript · 原文</h2></div><div class="pane-body" id="manuscript"></div></section><section class="pane"><div class="pane-head"><h2 data-research-text="Argument · 论证">Argument · 论证</h2></div><div class="pane-body"><div id="claims" class="claim-list"></div><div id="claimDetail"></div></div></section><section class="pane"><div class="pane-head"><h2 data-research-text="Review · 审查">Review · 审查</h2></div><div class="pane-body"><div id="lensTabs" class="tabs"></div><div id="review"></div></div></section></main>
<dialog id="decisionDialog"><form method="dialog" id="decisionForm"><select data-research-language aria-label="介面語言"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><h2 id="decisionTitle" data-research-text="人工裁决">人工裁决</h2><div id="decisionError"></div><label for="decisionValue" data-research-text="决定">决定</label><select id="decisionValue"><option value="accept" data-research-text="接受">接受</option><option value="reject" data-research-text="拒绝">拒绝</option><option value="defer" data-research-text="推迟">推迟</option></select><label for="decisionReason" data-research-text="理由（必填）">理由（必填）</label><textarea id="decisionReason" rows="3"></textarea><div id="actionFields"><label for="actionType" data-research-text="修改行动">修改行动</label><select id="actionType"><option value="narrow_claim" data-research-text="收窄主张">收窄主张</option><option value="add_evidence" data-research-text="增加证据">增加证据</option><option value="add_qualification" data-research-text="增加限定">增加限定</option><option value="remove_claim" data-research-text="删除主张">删除主张</option><option value="restructure_argument" data-research-text="重组论证">重组论证</option><option value="clarify_concept" data-research-text="澄清概念">澄清概念</option><option value="verify_citation" data-research-text="核验引文">核验引文</option><option value="other" data-research-text="其他">其他</option></select><label for="actionText" data-research-text="行动说明（接受时必填）">行动说明（接受时必填）</label><textarea id="actionText" rows="3"></textarea></div><div class="dialog-actions"><button value="cancel" data-research-text="取消">取消</button><button class="primary" id="saveDecision" value="default" data-research-text="保存正式决定">保存正式决定</button></div></form></dialog>
<dialog id="historyDialog"><form method="dialog"><select data-research-language aria-label="介面語言"><option value="zh-Hant">繁體中文</option><option value="en">English</option></select><h2 data-research-text="Argument History">Argument History</h2><p class="muted" data-research-text="每个数字是可审计的工作流状态，不是稿件质量分数。">每个数字是可审计的工作流状态，不是稿件质量分数。</p><div id="historyTimeline" class="timeline"></div><div class="dialog-actions"><button class="primary" data-research-text="关闭">关闭</button></div></form></dialog>
<script>__SCRIPTS__</script>
</body></html>
