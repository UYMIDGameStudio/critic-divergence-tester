name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          critic_runner.py
          critic_execution.py
          critic_scoring.py
          critic_workflow.py
          test/test_critic_runner.py

      - name: Smoke-test CLI
        run: |
          python critic_runner.py doctor
          python critic_runner.py list
          python critic_runner.py quickstart --help
          python critic_runner.py import-report --help
          python critic_runner.py adjudicate --help
          python critic_runner.py revision-plan --help
