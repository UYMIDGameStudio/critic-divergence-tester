name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Core without optional PDF/OCR / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Full Windows regression is still advancing at 15 minutes on hosted runners.
    # Keep all checks; allow the slower filesystem enough time to finish.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run unit tests
        run: python -m unittest discover -s test -p "test_*.py" -v

      - name: Compile Python sources
        run: >-
          python -m compileall -q
          critic_runner.py
          cli
          contracts
          document_review_stores
          studio_web
          document_text_encoding.py
          document_file_names.py
          document_review_office_formats.py
          document_review_text_formats.py
          document_review_legacy.py
          document_review_word.py
          document_review_pdf_render.py
          document_review_quality.py
          document_review_adversarial.py
          project_lifecycle.py
          studio_ui_state.py
          studio_selftest.py
          studio_startup.py
          studio_launcher.py
          document_review_components.py
          argument_gate_common.py
          project_lock.py
          argument_ir.py
          argument_contracts.py
          argument_workbench.py
          argument_review.py
          argument_adjudication.py
          argument_perspective.py
          argument_versioning.py
          argument_lineage.py
          argument_resolution.py
          argument_citations.py
          argument_ui.py
          argument_app.py
          argument_revision.py
          argument_gate.py
          argument_gate_b.py
          document_review_ingest.py
          document_review_model.py
          document_review_studio.py
          document_review_ui.py
          unified_app.py
          review_profiles.py
          academic_review.py
          critic_execution.py
          critic_scoring.py
          critic_workflow.py
          test/test_argument_ir.py
          test/test_argument_contracts.py
          test/test_argument_workbench.py
          test/test_argument_review.py
          test/test_argument_adjudication.py
          test/test_argument_perspective.py
          test/test_argument_versioning.py
          test/test_argument_lineage.py
          test/test_argument_resolution.py
          test/test_argument_citations.py
          test/test_argument_ui.py
          test/test_argument_app.py
          test/test_argument_revision.py
          test/test_argument_gate.py
          test/test_document_review_studio.py
          test/test_critic_runner.py

      - name: Smoke-test CLI
        run: |
          python critic_runner.py doctor
          python critic_runner.py app --help
          python critic_runner.py list
          python critic_runner.py ir init --help
          python critic_runner.py ir collect --help
          python critic_runner.py ir inspect --help
          python critic_runner.py ir rebuild --help
          python critic_runner.py ir verify-project --help
          python critic_runner.py ir ui --help
          python critic_runner.py ir import-version --help
          python critic_runner.py ir diff-versions --help
          python critic_runner.py ir lineage prepare --help
          python critic_runner.py ir lineage collect --help
          python critic_runner.py ir lineage adjudicate --help
          python critic_runner.py ir resolve prepare --help
          python critic_runner.py ir resolve collect --help
          python critic_runner.py ir resolve decide --help
          python critic_runner.py ir citations prepare --help
          python critic_runner.py ir citations collect --help
          python critic_runner.py ir citations decide --help
          python critic_runner.py ir citations show --help
          python critic_runner.py ir review prepare --help
          python critic_runner.py ir review collect --help
          python critic_runner.py ir review show --help
          python critic_runner.py ir review triage --help
          python critic_runner.py ir adjudicate --help
          python critic_runner.py ir revision-plan --help
          python critic_runner.py ir gate-a init --help
          python critic_runner.py ir gate-a prepare-baseline --help
          python critic_runner.py ir gate-a baseline --help
          python critic_runner.py ir gate-a session start --help
          python critic_runner.py ir gate-a session finish --help
          python critic_runner.py ir gate-a session list --help
          python critic_runner.py ir gate-a assess --help
          python critic_runner.py ir gate-a report --help
          python critic_runner.py ir gate-a decide --help
          python critic_runner.py ir gate-a verify --help
          python critic_runner.py quickstart --help
          python critic_runner.py import-report --help
          python critic_runner.py adjudicate --help
          python critic_runner.py revision-plan --help
          python critic_runner.py status --help
          python critic_runner.py resume --help
          python critic_runner.py studio --help
          python critic_runner.py studio-protocols --help
          python critic_runner.py studio-import-ai --help

      - name: Build and install the distributable package
        run: |
          python -m pip install setuptools==80.10.2 wheel==0.48.0
          python -m unittest test.test_wheel_delivery -v
          python scripts/build_wheel.py
          python -c "from pathlib import Path; import subprocess, sys; wheels = list(Path('dist').glob('*.whl')); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])])"

      - name: Verify installed package without checkout imports
        run: python -I scripts/verify_installed_package.py

  pdf-text:
    name: Real text PDF and page rendering / PDFium + pypdf
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install both real PDF backends
        run: python -m pip install ".[pdf]"

      - name: Verify valid and short text PDFs
        run: >-
          python -m unittest -v
          test.test_document_review_studio.DocumentReviewStudioTests.test_real_pdf_backend_parses_valid_text_pdf_when_installed
          test.test_document_review_studio.DocumentReviewStudioTests.test_short_text_pdf_is_not_routed_to_ocr

      - name: Verify installed rendering adapter
        run: python -c "from studio_selftest import run_self_test; result=run_self_test(); assert 'pdf-page-render' in result['checked']; print(result)"

  ocr-fixture:
    name: Scanned PDF / fixed mock OCR adapter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify the complete scanned-page adapter flow
        run: >-
          python -m unittest -v
          test.test_document_review_studio.DocumentReviewStudioTests.test_mock_ocr_fixture_covers_scanned_page_flow
