name: Delivery verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Verify document flow, draft durability and Traditional Chinese/English UI
        run: npm run test:browser
      - name: Preserve browser screenshots and localization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-verification
          path: |
            dist/browser-verification/
            dist/browser-state-verification/
            dist/browser-localization/
            dist/browser-research-localization/
            dist/browser-close-reading-0.2.2/
            dist/http-protocol-security/browser/
          if-no-files-found: warn
          retention-days: 14
      - run: python scripts/benchmark_delivery.py
  portable:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - run: python -m pip install -r scripts/release-requirements.txt
      - name: Verify installer failures, retries, upgrades and uninstall
        run: python -m unittest test.test_portable_install.PortableInstallTests -v
      - run: python scripts/build_portable.py
      - name: Install and uninstall the actual built release in isolated directories
        shell: pwsh
        run: |
          $release = @(Get-ChildItem -LiteralPath dist -Directory -Filter 'DocumentReviewStudio-*-win32')
          if ($release.Count -ne 1) { throw 'Expected exactly one built Windows release' }
          $env:STUDIO_PORTABLE_RELEASE = Join-Path $release[0].FullName 'app'
          if (-not (Test-Path -LiteralPath (Join-Path $env:STUDIO_PORTABLE_RELEASE 'DocumentReviewStudio.exe'))) { throw 'Built application directory is missing' }
          python -m unittest test.test_portable_install.BuiltPortableTests -v
